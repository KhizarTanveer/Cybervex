<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo-tags -->
    <!-- ↑ Each page's title, description, canonical and social tags are added at build time from
         src/data/seo.js (see vite.config.js), and kept up to date in the browser by lib/seoHead.js. -->
    
    <!-- Headings: Clash Display Semibold (self-hosted). Google Fonts: Outfit (paragraphs and UI text) -->
    <link rel="preload" href="/fonts/ClashDisplay-Semibold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Business details for search engines (schema.org). Keep in sync with the Contact page and footer. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.cybervexdigital.com/#organization",
          "name": "Cybervex Digital",
          "alternateName": "Cybervex",
          "url": "https://www.cybervexdigital.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.cybervexdigital.com/icon-512.png",
            "width": 512,
            "height": 512
          },
          "image": "https://www.cybervexdigital.com/icon-512.png",
          "description": "Cybervex Digital is a digital marketing and BPO (business process outsourcing) agency providing marketing, branding, web development, customer support, back-office, virtual assistance, sales operations and event management services for startups, small businesses and established organizations.",
          "slogan": "We turn ideas into digital experiences.",
          "email": "info@cybervexdigital.com",
          "telephone": "+92-300-9326529",
          "areaServed": "Worldwide",
          "contactPoint": [
            {
              "@type": "ContactPoint",
              "contactType": "customer service",
              "telephone": "+92-300-9326529",
              "email": "info@cybervexdigital.com",
              "availableLanguage": ["English", "Urdu"]
            },
            {
              "@type": "ContactPoint",
              "contactType": "sales",
              "telephone": "+92-300-5559759",
              "availableLanguage": ["English", "Urdu"]
            }
          ],
          "sameAs": [
            "https://www.instagram.com/cybervexdigital",
            "https://www.linkedin.com/company/cybervex-digital",
            "https://www.threads.com/@cybervexdigital",
            "https://www.facebook.com/cybervexdigital"
          ],
          "knowsAbout": [
            "Digital Marketing",
            "Search Engine Optimization",
            "Social Media Management",
            "Paid Advertising",
            "Lead Generation",
            "Graphic Design",
            "Branding",
            "Website Design and Development",
            "E-commerce",
            "Business Process Outsourcing",
            "Customer Support",
            "Virtual Assistance",
            "Telemarketing",
            "Event Management",
            "Recruitment and HR Support"
          ],
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Marketing and BPO Services",
            "itemListElement": [
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Digital Marketing Services" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Search Engine Optimization (SEO)" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Social Media Management" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Paid Advertising & Lead Generation" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Graphic Design & Branding" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website Design & Development" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "E-commerce Solutions" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Business Process Outsourcing (BPO)" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Customer Support Services" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Virtual Assistance & Administrative Support" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Sales, Telemarketing & Lead Operations" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Events & Event Management" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Recruitment & HR Support" } }
            ]
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.cybervexdigital.com/#website",
          "url": "https://www.cybervexdigital.com/",
          "name": "Cybervex Digital",
          "inLanguage": "en",
          "publisher": { "@id": "https://www.cybervexdigital.com/#organization" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
