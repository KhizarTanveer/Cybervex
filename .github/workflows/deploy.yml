# Publishes the site on the VPS after every push to main (or on demand from the Actions tab).
# The VPS only lets this key run /usr/local/bin/cybervex-update (pull, build, restart) — nothing else.
# Repository secrets: VPS_HOST, VPS_DEPLOY_KEY (private key), VPS_KNOWN_HOSTS (ssh-keyscan of the VPS).
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cancelling it mid-build
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Update the live site
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # VPS_DEPLOY_KEY may be the key itself (BEGIN…END) or the same key base64-encoded on one
          # line, which survives copy-paste. Pasted text can also carry \r or stray spaces.
          key="$(printf '%s' "$VPS_DEPLOY_KEY" | tr -d '\r')"
          case "$key" in
            *BEGIN*) printf '%s\n' "$key" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' > ~/.ssh/deploy_key ;;
            *) printf '%s' "$key" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key ;;
          esac
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' | grep -v '^$' > ~/.ssh/known_hosts
          # Public key / fingerprint only — shows whether the right key and host were pasted
          ssh-keygen -y -f ~/.ssh/deploy_key | ssh-keygen -lf - || { echo "VPS_DEPLOY_KEY is not a valid private key."; exit 1; }
          ssh-keygen -lf ~/.ssh/known_hosts || { echo "VPS_KNOWN_HOSTS is not valid."; exit 1; }
          # The server runs its fixed update command whatever is sent here.
          # The connection to the VPS sometimes times out, so try a few times before giving up
          # (255 = ssh itself failed; any other code comes from the update script and is final).
          for attempt in 1 2 3 4 5; do
            status=0
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 "root@$VPS_HOST" update || status=$?
            [ "$status" -ne 255 ] && exit "$status"
            echo "Could not reach the VPS (attempt $attempt), retrying in 20s..."
            sleep 20
          done
          exit 255

      - name: Check the live site
        run: |
          for i in $(seq 1 10); do
            curl -fsS -o /dev/null https://www.cybervexdigital.com/api/jobs && echo "Site is up" && exit 0
            sleep 3
          done
          echo "Site did not respond" && exit 1
